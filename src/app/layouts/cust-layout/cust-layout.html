<div class="app-shell">

  <app-cust-sidebar
    class="sidebar"
    [class.is-open]="sidebarOpen()"
    [class.is-collapsed]="sidebarCollapsed()"
    (navClicked)="closeSidebar()">
  </app-cust-sidebar>

  <!-- Scrim overlay for mobile — (click) closes sidebar -->
  <div class="scrim" [class.is-open]="sidebarOpen()" (click)="closeSidebar()"></div>

  <!-- Main content area -->
  <div class="main">
    <app-cust-topbar
      class="topbar"
      (menuToggle)="openSidebar()">
    </app-cust-topbar>

    <main class="view-area">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>

<app-toast></app-toast>
<app-modal></app-modal>
<app-confirmation-modal></app-confirmation-modal>
