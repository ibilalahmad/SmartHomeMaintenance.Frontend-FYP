<!-- Customers View -->
<div class="view-head">
  <div>
    <h1>Customers</h1>
    <p>View booking history, complaints, and account status.</p>
  </div>
  <button class="btn btn-primary" (click)="toggleAddForm()">
    <i class="bi bi-plus-lg"></i> {{ showAddForm() ? 'Cancel' : 'Add Customer' }}
  </button>
</div>

@if (showAddForm()) {
  <div class="panel panel--form mb-4">
    <h3 class="mb-3" style="font-size: 16px; font-weight: 600;">New Customer</h3>
    <form (ngSubmit)="submitCustomer()" #addForm="ngForm" class="d-flex flex-column gap-3">
      <div class="row g-3">
        <div class="col-md-12">
          <label class="form-label">Customer Name</label>
          <input type="text" class="form-control" name="name" [(ngModel)]="newCustomer.name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Bookings</label>
          <input type="number" class="form-control" name="bookings" [(ngModel)]="newCustomer.bookings" min="0" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Complaints</label>
          <input type="number" class="form-control" name="complaints" [(ngModel)]="newCustomer.complaints" min="0" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" name="status" [(ngModel)]="newCustomer.status">
            <option value="Active">Active</option>
            <option value="Blocked">Blocked</option>
          </select>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-2">
        <button type="button" class="btn btn-light" (click)="toggleAddForm()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!addForm.valid">Save Customer</button>
      </div>
    </form>
  </div>
}

<div class="toolbar">
  <div class="search-field search-field--panel">
    <i class="bi bi-search"></i>
    <input
      type="text"
      placeholder="Search customers…"
      (input)="onSearch($any($event.target).value)"
      id="customerSearch">
  </div>
</div>

<div class="panel">
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Bookings</th>
          <th>Complaints Filed</th>
          <th>Joined</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (c of customers(); track c.name) {
          <tr>
            <td>
              <div class="cell-person">
                <app-avatar-initials [name]="c.name"></app-avatar-initials>
                <div><div class="cell-title">{{ c.name }}</div></div>
              </div>
            </td>
            <td>{{ c.bookings }}</td>
            <td>{{ c.complaints }}</td>
            <td>{{ c.joined }}</td>
            <td><app-status-badge [status]="c.status"></app-status-badge></td>
            <td><button class="icon-action"><i class="bi bi-three-dots"></i></button></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
