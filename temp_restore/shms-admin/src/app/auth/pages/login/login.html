<div class="login-wrapper">
  <!-- Left Side: Big Vector Image -->
  <div class="login-left">
    <div class="illustration-wrap">
      <img src="login-illustration.png" alt="ServiFix Maintenance Illustration">
    </div>
  </div>

  <!-- Right Side: Logo & Form -->
  <div class="login-right">
    <div class="login-container">
      <!-- Right Side Top: Logo -->
      <div class="login-logo">
        <span class="brand-mark"><i class="bi bi-tools"></i></span>
        <div class="brand-text">
          <strong>ServiFix</strong>
          <small>Admin Panel</small>
        </div>
      </div>

      <!-- Login Form below -->
      <div class="login-form-area">
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Access the ServiFix administrator console</p>

        @if (errorMessage()) {
          <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div>{{ errorMessage() }}</div>
          </div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="form-row">
            <label for="loginEmail">Email Address</label>
            <input
              id="loginEmail"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              placeholder="name@servifix.pk"
              [disabled]="isLoading()">
          </div>

          <div class="form-row">
            <label for="loginPassword">Password</label>
            <input
              id="loginPassword"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              placeholder="••••••••"
              [disabled]="isLoading()">
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input
                type="checkbox"
                name="rememberMe"
                [(ngModel)]="rememberMe"
                [disabled]="isLoading()">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link" (click)="$event.preventDefault()">Forgot password?</a>
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100 justify-content-center"
            [disabled]="isLoading() || !loginForm.valid">
            @if (isLoading()) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Signing in...
            } @else {
              Sign In
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
