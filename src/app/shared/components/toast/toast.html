<div class="toast-container position-fixed top-0 end-0 p-3 mt-5" style="z-index: 1055;">
  @for (toast of toastService.toasts(); track toast) {
    <div class="toast show align-items-center text-bg-{{ toast.type }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fw-semibold">
          {{ toast.message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" (click)="toastService.remove(toast)"></button>
      </div>
    </div>
  }
</div>
