<!-- Mobile hamburger -->
<button class="icon-btn menu-toggle" aria-label="Toggle menu" (click)="onMenuToggle()">
  <i class="bi bi-list"></i>
</button>

<!-- Global search -->
<div class="search-field">
  <i class="bi bi-search"></i>
  <input type="text" placeholder="Search providers, customers, booking" id="globalSearch">
</div>

<!-- Right-side actions -->
<div class="topbar-actions">
  <button class="icon-btn" aria-label="Notifications">
    <i class="bi bi-bell"></i>
    <span class="dot"></span>
  </button>

  <div class="dropdown">
    <div class="admin-chip" data-bs-toggle="dropdown" style="cursor: pointer;">
      <i class="bi bi-person-circle" style="font-size: 2.2rem; color: var(--secondary);"></i>
      <div class="admin-chip-text">
        <strong>Bilal Ahmed</strong>
        <small>Super Admin</small>
      </div>
      <i class="bi bi-chevron-down"></i>
    </div>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" routerLink="/admin/settings"><i class="bi bi-gear me-2"></i> Settings</a></li>
      <li><button class="dropdown-item text-danger" (click)="onLogout()"><i class="bi bi-box-arrow-left me-2"></i> Log Out</button></li>
    </ul>
  </div>
</div>
