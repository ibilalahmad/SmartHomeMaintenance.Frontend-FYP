<!-- Mobile hamburger -->
<button class="icon-btn menu-toggle" aria-label="Toggle menu" (click)="onMenuToggle()">
  <i class="bi bi-list"></i>
</button>

<!-- Global search -->
<div class="search-field">
  <i class="bi bi-search"></i>
  <input type="text" placeholder="Search bookings or ratings" id="globalSearch">
</div>

<!-- Right-side actions -->
<div class="topbar-actions">
  <button class="icon-btn" aria-label="Notifications" routerLink="/sp/notifications">
    <i class="bi bi-bell"></i>
    <span class="dot"></span>
  </button>

  <div class="dropdown">
    <div class="admin-chip" data-bs-toggle="dropdown" style="cursor: pointer;">
      @if (authService.currentSp()?.profilePic) {
        <img [src]="authService.currentSp()?.profilePic" alt="SP avatar">
      } @else {
        <i class="bi bi-person-circle" style="font-size: 2.2rem; color: var(--secondary);"></i>
      }
      <div class="admin-chip-text">
        <strong>{{ authService.currentSp()?.fullName || 'Service Provider' }}</strong>
        <small>{{ authService.currentSp()?.expertise || 'SP' }}</small>
      </div>
      <i class="bi bi-chevron-down"></i>
    </div>
    <ul class="dropdown-menu dropdown-menu-end">
      <li><a class="dropdown-item" routerLink="/sp/profile"><i class="bi bi-person me-2"></i> Profile</a></li>
      <li><button class="dropdown-item text-danger" (click)="onLogout()"><i class="bi bi-box-arrow-left me-2"></i> Log Out</button></li>
    </ul>
  </div>
</div>
