<div class="register-wrapper">
  <div class="register-container" style="max-width: 500px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <img src="/assets/logo.png" alt="App Logo" style="max-height: 50px;">
      <h2 style="margin-top: 16px;">Forgot Password</h2>
      <p style="color: var(--muted);">Enter your email to receive a reset link.</p>
    </div>

    @if (errorMessage()) {
    <div style="padding: 12px; background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--red); color: var(--red); margin-bottom: 24px; border-radius: 4px; display: flex; align-items: center; gap: 8px;">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <div>{{ errorMessage() }}</div>
    </div>
    }

    @if (successMessage()) {
    <div style="padding: 12px; background: rgba(34, 197, 94, 0.1); border-left: 4px solid var(--green); color: var(--green); margin-bottom: 24px; border-radius: 4px; display: flex; align-items: center; gap: 8px;">
      <i class="bi bi-check-circle-fill"></i>
      <div>{{ successMessage() }}</div>
    </div>
    } @else {
    <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--muted-2);">Email Address</label>
        <input type="email" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-1); color: var(--text);" name="email" [(ngModel)]="email" required placeholder="name@example.com" [disabled]="isLoading()">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" [disabled]="isLoading() || !resetForm.valid">
        @if (isLoading()) {
          <span>Sending...</span>
        } @else {
          Send Reset Link
        }
      </button>

      <div style="text-align: center; margin-top: 24px; font-size: 14px;">
        <a routerLink="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;"><i class="bi bi-arrow-left"></i> Back to Login</a>
      </div>
    </form>
    }
  </div>
</div>
