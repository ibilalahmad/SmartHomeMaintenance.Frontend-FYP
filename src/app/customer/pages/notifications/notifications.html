<div class="view-head">
  <div>
    <h2>Notifications</h2>
    <p class="text-muted">Stay updated with your latest alerts and messages.</p>
  </div>
</div>

<div class="panel" style="max-width: 800px; margin: 0 auto;">
  <div style="display: flex; flex-direction: column;">
    @for (notif of notifs; track notif.id) {
      <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; gap: 16px;">
         <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--bg-1); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;" [style.color]="notif.color">
           <i class="bi {{ notif.icon }}"></i>
         </div>
         <div>
           <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
             <h4 style="margin: 0; font-size: 15px;">{{ notif.title }}</h4>
             <span style="font-size: 12px; color: var(--muted-2);">{{ notif.time }}</span>
           </div>
           <p style="margin: 0; color: var(--text); font-size: 14px;">{{ notif.message }}</p>
         </div>
      </div>
    }
  </div>
</div>
