<!-- Mobile hamburger -->
<button class="icon-btn menu-toggle" aria-label="Toggle menu" (click)="onMenuToggle()">
  <i class="bi bi-list"></i>
</button>

<!-- Global search -->
<div class="search-field">
  <i class="bi bi-search"></i>
  <input type="text" placeholder="Search providers, customers, bookings…" id="globalSearch">
</div>

<!-- Right-side actions -->
<div class="topbar-actions">
  <button class="icon-btn" aria-label="Notifications">
    <i class="bi bi-bell"></i>
    <span class="dot"></span>
  </button>

  <div class="admin-chip">
    <img src="https://i.pravatar.cc/64?img=68" alt="Admin avatar">
    <div class="admin-chip-text">
      <strong>Bilal Ahmed</strong>
      <small>Super Admin</small>
    </div>
    <i class="bi bi-chevron-down"></i>
  </div>
</div>
