<div class="login-wrapper">
  <!-- Left Side: Big Vector Image -->
  <div class="login-left">
    <div class="illustration-wrap">
      <img src="login-illustration.png" alt="SHMS Maintenance Illustration">
    </div>
  </div>

  <!-- Center Side: Logo & Form -->
  <div class="login-right">
    <div class="login-container">
      <!-- Right Side Top: Logo -->
      <div class="d-flex justify-content-center mb-3">
        <img src="/assets/logo.png" alt="App Logo" class="responsive-logo">
      </div>

      <div class="login-form-area">
        <h1>Forgot Password</h1>
        <p class="login-subtitle">Enter your email to reset your password</p>

        @if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div>{{ errorMessage() }}</div>
        </div>
        }
        @if (successMessage()) {
        <div class="alert alert-success d-flex align-items-center gap-2">
          <i class="bi bi-check-circle-fill"></i>
          <div>{{ successMessage() }}</div>
        </div>
        }

        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
          <div class="form-row">
            <label for="loginEmail">Email Address</label>
            <input id="loginEmail" type="email" name="email" [(ngModel)]="email" required placeholder="name@domain.com"
              [disabled]="isLoading()">
          </div>

          <button type="submit" class="btn btn-primary w-100 justify-content-center mt-3"
            [disabled]="isLoading() || !forgotForm.valid">
            @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Sending...
            } @else {
            Send Reset Link
            }
          </button>
          
          <div class="text-center mt-4" style="font-size: 0.9rem;">
             <p><a routerLink="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;"><i class="bi bi-arrow-left"></i> Back to Login</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
