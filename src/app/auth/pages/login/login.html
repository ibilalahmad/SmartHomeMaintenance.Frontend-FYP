<div class="login-wrapper">
  <!-- Left Side: Big Vector Image -->
  <div class="login-left">
    <div class="illustration-wrap">
      <img src="login-illustration.png" alt="SHMS Maintenance Illustration">
    </div>
  </div>

  <!-- Center Side: Logo & Form -->
  <div class="login-right">
    <div class="login-container">
      <!-- Right Side Top: Logo -->
      <div class="d-flex justify-content-center mb-3">
        <img src="/assets/logo.png" alt="App Logo" class="responsive-logo">
      </div>

      <!-- Login Form below -->
      <div class="login-form-area">
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Sign in to access your account</p>

        @if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div>{{ errorMessage() }}</div>
        </div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="form-row">
            <label for="loginEmail">Email Address</label>
            <input id="loginEmail" type="email" name="email" [(ngModel)]="email" required placeholder="name@shms.com"
              [disabled]="isLoading()">
          </div>

          <div style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label style="font-size: 14px; font-weight: 500;">Password</label>
            </div>
            <div style="position: relative;">
              <input [type]="showPassword ? 'text' : 'password'" class="form-control" name="password" [(ngModel)]="password" required style="width: 100%; padding: 10px 40px 10px 12px;" [disabled]="isLoading()" placeholder="••••••••">
              <button type="button" (click)="showPassword = !showPassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; padding: 0;">
                <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" [disabled]="isLoading()">
              <span>Remember me</span>
            </label>
            <a routerLink="/sp-forgot-password" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 justify-content-center"
            [disabled]="isLoading() || !loginForm.valid">
            @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Signing in...
            } @else {
            Sign In
            }
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center" style="display: flex; gap: 16px;">
           <div style="flex: 1;">
              <p class="text-muted small mb-2">New Customer?</p>
              <a routerLink="/customer-register" class="btn btn-outline w-100 justify-content-center">Register</a>
           </div>
           <div style="flex: 1;">
              <p class="text-muted small mb-2">New Service Provider?</p>
              <a routerLink="/sp-register" class="btn btn-outline-primary w-100 justify-content-center">Apply Now</a>
           </div>
        </div>
      </div>
    </div>
  </div>
</div>
