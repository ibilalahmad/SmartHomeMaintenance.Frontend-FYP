<!-- Brand -->
<div class="brand" style="justify-content: center; padding-bottom: 15px; padding-top: 5px;">
  <img src="/assets/nav-logo.png" alt="SHMS Logo" style="max-height: 100%; max-width: 100%;">
</div>

<!-- Navigation -->
<nav class="nav-menu">
  @for (group of navGroups; track group.groupLabel) {
  <p class="nav-label">{{ group.groupLabel }}</p>

  @for (item of group.items; track item.route) {
  <a class="nav-item" [class.is-disabled]="item.disabled" [routerLink]="item.disabled ? null : item.route" routerLinkActive="is-active" (click)="!item.disabled && onNavClick()">
    <i class="bi {{ item.icon }}"></i>
    <span>{{ item.label }}</span>
    @if (item.badge) {
    <span class="nav-badge" [class.nav-badge--danger]="item.badgeDanger">
      {{ item.badge }}
    </span>
    }
  </a>
  }
  }
</nav>

<!-- Footer links -->
<div class="sidebar-foot">
  <a class="nav-item" routerLink="/sp/profile" routerLinkActive="is-active" (click)="onNavClick()">
    <i class="bi bi-person"></i><span>Profile</span>
  </a>
  <button class="nav-item" (click)="onLogout()">
    <i class="bi bi-box-arrow-left"></i><span>Log Out</span>
  </button>
</div>
